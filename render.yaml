# CityResolve — Blueprint Render (à placer à la racine du dépôt).
# Les secrets ne sont JAMAIS écrits ici : sync: false veut dire que la
# valeur se renseigne dans le tableau de bord Render, après création.
services:
  - type: web
    name: cityresolve
    runtime: docker
    repo: https://github.com/Lebosstech/cityresolve
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    region: oregon
    plan: free
    autoDeploy: false
    healthCheckPath: /api/health
    envVars:
      - key: CITYRESOLVE_MONGO_URI
        sync: false
      - key: MODEL_API_KEY
        sync: false
      # Jeton de l'espace municipal (OBLIGATOIRE en public : sans lui,
      # regroupement, planification, journaux et appels Meta restent ouverts).
      # Générer une valeur longue et aléatoire dans le tableau de bord Render.
      - key: CITYRESOLVE_MUNICIPAL_TOKEN
        sync: false
      # Connexion démo en un clic (projet de démonstration uniquement) :
      # à renseigner à 'true' dans le tableau de bord Render, JAMAIS ici.
      # Effet : un bouton « Se connecter (démo) » apparaît sur l'écran
      # de verrouillage et ouvre une session sans jeton (journalisé
      # comme municipal.demo_login). Le vrai jeton n'est jamais exposé
      # au frontend. Ne pas activer hors démo.
      # - key: CITYRESOLVE_DEMO_LOGIN
      #   value: 'true'
